name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build every lesson on its own
        run: for lesson in [0-9][0-9][0-9]-*/; do (cd "$lesson" && ./gradlew build) || exit 1; done
